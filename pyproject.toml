[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "provenpaid-mcp"
version = "0.1.0"
description = "MCP server for ProvenPaid: check an x402 endpoint before your agent pays it. Evidence before you pay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Justin Smith" }]
keywords = ["mcp", "x402", "agents", "payments", "usdc", "base"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp==2.3.0",
  "x402[evm,httpx]==2.8.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "x402[fastapi,evm,httpx]==2.8.0", "fastapi>=0.110"]

[project.scripts]
provenpaid-mcp = "provenpaid_mcp.server:main"

[project.urls]
Homepage = "https://api.provenpaid.com"
Methodology = "https://api.provenpaid.com/methodology"
Source = "https://github.com/justinsmithphd/provenpaid-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
